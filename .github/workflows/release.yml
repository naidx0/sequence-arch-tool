# RELEASE — the installers, built on the platforms that can build them.
#
# Owner ruling (Max, 2026-09-10): "just create a DMG for macOS ... I don't know
# if we need to have an Apple developer account and pay for that ... Windows,
# the EXE launches and works from my computer, fine, people can just use that."
# So: a DMG, unsigned, no Apple account, no code-signing certificate anywhere.
#
# WHY THIS EXISTS RATHER THAN A LOCAL BUILD. electron-builder does not
# cross-compile the mac target from Windows, and the only machine this project
# is developed on runs Windows. A macOS runner is the whole reason for the file.
# The public mirror is a public repository, so those runners are free there.
#
# Event-driven only — a tag push or a manual dispatch. Do not add a schedule
# timer; tools/ci/no-cron.test.mjs fails the hygiene job, and the owner's
# standing rule is no timers burning runners unattended.
#
# NOT SIGNED, AND THAT IS A DECISION, NOT AN OVERSIGHT. Both artefacts warn on
# first open: SmartScreen on Windows, Gatekeeper on macOS. The README says so
# under Download, with the right-click -> Open workaround, because a download
# that warns and does not explain itself reads as broken software.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not delete the other's artefact: a Windows
      # build that succeeded is still worth shipping while mac is being fixed.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer + portable zip
            artifact: sequence-windows
            # THE ZIP SHIPS TOO, since 2026-09-19. An unsigned 180 MB NSIS
            # installer is the shape SmartScreen blocks, that antivirus
            # quarantines mid-write, and that NSIS then refuses with "the
            # installer you are trying to use is corrupted or incomplete" once
            # a byte has been touched - all of which reach a person as "it's
            # corrupted", which is exactly the report that came back on 0.1.0.
            # The zip has none of that surface and is the only artefact that
            # runs from a USB stick or a locked-down work laptop.
            glob: |
              packages/desktop/release/*.exe
              packages/desktop/release/*-win.zip
          - os: macos-latest
            label: macOS disk image + zip (unsigned)
            artifact: sequence-macos
            # The mac zip is electron-builder's own second target and it is the
            # one a person can unzip straight into /Applications. Both go out.
            glob: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*-mac.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prepare-server.mjs refuses unless analyzer/dist and web2/dist exist —
      # it copies them, it does not build them.
      - run: pnpm -r build

      - name: Pack
        working-directory: packages/desktop
        env:
          # Belt and braces with `mac.identity: null` in electron-builder.yml.
          # Without this electron-builder hunts the keychain for a certificate,
          # and on a runner that has none the failure is a confusing one about
          # identities rather than a clear "not signing".
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The token is NOT passed here. electron-builder publishes to GitHub
          # by itself when it finds one, which would race the release job below
          # and produce a half-populated draft. Publishing happens in one place.
          GH_TOKEN: ""
        run: pnpm dist

      - name: What was produced
        shell: bash
        run: ls -lh packages/desktop/release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to the release
    needs: build
    # THE JOB NOW DOES WHAT THE MATRIX COMMENT ALREADY PROMISED.
    #
    # `fail-fast: false` is there so "one platform failing must not delete the
    # other's artefact", and then a bare `needs: build` skipped this job the
    # moment either platform failed — so the promise was never kept. Measured
    # on the first 0.1.1 attempt: Windows built, macOS failed on a symlink
    # guard, and NOTHING was published, including the Windows artefact that was
    # sitting there finished.
    #
    # `!cancelled()` and not `always()`: a run somebody stopped by hand must not
    # go on to cut a release. The "at least two files" check below is what stops
    # this publishing an empty one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        # A failed platform uploaded nothing, and demanding its artefact here
        # would re-create the skip this job exists to avoid.
        continue-on-error: true

      - name: What will be attached
        run: |
          find artifacts -type f -print0 | xargs -0 ls -lh

      # `gh` rather than a third-party release action: it ships on the runner,
      # it is the same tool a person would use by hand, and a release is the one
      # step where an unreviewed third-party action would be holding the token.
      # ── ONE MANIFEST FOR THE WHOLE RELEASE ──────────────────────────────
      #
      # `pnpm dist` writes a SHASUMS256.txt on each runner, and two of those
      # would collide on upload and disagree about what the release contains.
      # It is generated HERE instead, over everything that actually arrived, so
      # the manifest and the release are the same set by construction.
      #
      # A checksum does not stop a bad download. It turns an unanswerable
      # report - "the package is broken" - into a one-line answer, which is the
      # thing 0.1.0 could not do: there was nothing published to compare a
      # local copy against, so a truncated download, an antivirus bite and a
      # SmartScreen block were indistinguishable from each other and from a
      # bad build.
      - name: Checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} out/ \;
          cd out
          sha256sum * > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find out -type f)
          # TWO, not one: a release with only the manifest is an empty release
          # with a receipt. The manifest itself is always one of the files.
          if [ ${#FILES[@]} -lt 2 ]; then
            echo "no installers were produced — refusing to cut an empty release" >&2
            exit 1
          fi
          NOTES=$(cat <<'EOF'
          One file per platform. Nothing else to install — no Node, no Docker, no account.

          - **Windows** — `Sequence Setup <version>.exe` (installer) or `Sequence-<version>-win.zip`
            (portable: unzip anywhere and run `Sequence.exe`, nothing is written outside the folder).
          - **macOS** — the `.dmg`, or the `.zip` if you would rather drag the app in yourself.

          **These builds are not code-signed.** Windows shows *More info → Run anyway*; macOS asks
          you to right-click the app and choose *Open* the first time. Nothing is wrong with the
          download — a signing certificate is simply not something this project has bought.

          `SHASUMS256.txt` is attached. To check your copy:

              Windows   certutil -hashfile "Sequence Setup <version>.exe" SHA256
              macOS     shasum -a 256 -c SHASUMS256.txt
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Sequence $TAG" \
              --notes "$NOTES"
          fi
