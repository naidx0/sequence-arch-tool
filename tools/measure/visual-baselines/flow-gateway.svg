<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <title>AI feature gateway architecture</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0.5L7.5 4L0 7.5z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
  </defs>
  <text x="10" y="18" font-size="14" font-weight="600" fill="currentColor">AI feature gateway</text>
  <!-- edges -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M130 160 L190 160"/>
    <path d="M300 160 L360 160"/>
    <path d="M300 150 C330 100 330 70 360 70"/>
    <path d="M300 170 C330 220 330 250 360 250"/>
    <path d="M470 160 L540 160"/>
    <path d="M470 70 L540 70"/>
    <path d="M650 160 C670 160 670 250 650 250"/>
    <path d="M470 250 L540 250"/>
  </g>
  <g font-size="10.5" fill="currentColor" fill-opacity="0.7" text-anchor="middle">
    <text x="160" y="152">HTTPS</text>
    <text x="330" y="152">route</text>
    <text x="330" y="96">lookup</text>
    <text x="330" y="228">events</text>
    <text x="505" y="152">stream</text>
  </g>
  <!-- nodes -->
  <g fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3">
    <rect x="30" y="140" width="100" height="40" rx="20"/>
    <rect x="190" y="136" width="110" height="48" rx="8" stroke="#2f6fed" stroke-width="1.8"/>
    <rect x="360" y="50" width="110" height="40" rx="8"/>
    <rect x="360" y="140" width="110" height="40" rx="8"/>
    <rect x="360" y="230" width="110" height="40" rx="20"/>
    <rect x="540" y="50" width="110" height="40" rx="8"/>
    <rect x="540" y="140" width="110" height="40" rx="8" stroke-dasharray="5 3"/>
    <rect x="540" y="230" width="110" height="40" rx="8"/>
  </g>
  <g fill="currentColor" font-weight="600" text-anchor="middle">
    <text x="80" y="165">Product app</text>
    <text x="245" y="157">AI gateway</text>
    <text x="415" y="75">Cache</text>
    <text x="415" y="165">Quota service</text>
    <text x="415" y="255">Usage events</text>
    <text x="595" y="75">Prompt store</text>
    <text x="595" y="165">Model provider</text>
    <text x="595" y="255">Warehouse</text>
  </g>
  <text x="245" y="174" font-size="10.5" fill="currentColor" fill-opacity="0.7" text-anchor="middle">auth, routing</text>
</svg>
