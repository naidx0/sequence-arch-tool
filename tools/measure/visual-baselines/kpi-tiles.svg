<svg viewBox="0 0 720 100" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <title>Pilot KPIs</title>
  <g>
    <rect x="0" y="0" width="170" height="90" rx="8" fill="currentColor" fill-opacity="0.06"/>
    <text x="14" y="22" font-size="11" fill="currentColor" fill-opacity="0.65">Pilot users</text>
    <text x="14" y="58" font-size="26" font-weight="700" fill="currentColor">1,000</text>
    <text x="14" y="78" font-size="11" fill="currentColor" fill-opacity="0.65">+120 this week</text>
  </g>
  <g transform="translate(183 0)">
    <rect width="170" height="90" rx="8" fill="currentColor" fill-opacity="0.06"/>
    <text x="14" y="22" font-size="11" fill="currentColor" fill-opacity="0.65">Peak load</text>
    <text x="14" y="58" font-size="26" font-weight="700" fill="currentColor">44.4</text>
    <text x="68" y="58" font-size="12" fill="currentColor" fill-opacity="0.65">rps</text>
    <text x="14" y="78" font-size="11" fill="currentColor" fill-opacity="0.65">4x average</text>
    <polyline points="100,52 112,48 124,50 136,42 150,36" fill="none" stroke="#2f6fed" stroke-width="1.6"/>
  </g>
  <g transform="translate(366 0)">
    <rect width="170" height="90" rx="8" fill="currentColor" fill-opacity="0.06"/>
    <text x="14" y="22" font-size="11" fill="currentColor" fill-opacity="0.65">p99 latency</text>
    <text x="14" y="58" font-size="26" font-weight="700" fill="currentColor">870</text>
    <text x="64" y="58" font-size="12" fill="currentColor" fill-opacity="0.65">ms</text>
    <text x="14" y="78" font-size="11" fill="#c27a0a">above 800 ms SLO</text>
  </g>
  <g transform="translate(549 0)">
    <rect width="170" height="90" rx="8" fill="currentColor" fill-opacity="0.06"/>
    <text x="14" y="22" font-size="11" fill="currentColor" fill-opacity="0.65">Error rate</text>
    <text x="14" y="58" font-size="26" font-weight="700" fill="currentColor">0.4</text>
    <text x="58" y="58" font-size="12" fill="currentColor" fill-opacity="0.65">%</text>
    <text x="14" y="78" font-size="11" fill="#169a68">within budget</text>
  </g>
</svg>
