<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="12">
  <title>Gateway latency distribution</title>
  <text x="10" y="18" font-size="14" font-weight="600" fill="currentColor">Gateway latency</text>
  <g stroke="currentColor" stroke-opacity="0.15">
    <line x1="44" y1="60" x2="700" y2="60"/>
    <line x1="44" y1="105" x2="700" y2="105"/>
    <line x1="44" y1="150" x2="700" y2="150"/>
    <line x1="44" y1="195" x2="700" y2="195"/>
  </g>
  <g fill="currentColor" fill-opacity="0.65" font-size="11" text-anchor="end">
    <text x="38" y="199">0</text>
    <text x="38" y="154">10</text>
    <text x="38" y="109">20</text>
    <text x="38" y="64">30</text>
  </g>
  <g fill="#2f6fed" fill-opacity="0.85">
    <rect x="48" y="75" width="50" height="120"/>
    <rect x="100" y="45" width="50" height="150"/>
    <rect x="152" y="90" width="50" height="105"/>
    <rect x="204" y="135" width="50" height="60"/>
    <rect x="256" y="165" width="50" height="30"/>
    <rect x="308" y="180" width="50" height="15"/>
    <rect x="360" y="185" width="50" height="10"/>
    <rect x="412" y="180" width="50" height="15"/>
    <rect x="464" y="175" width="50" height="20"/>
    <rect x="516" y="184" width="50" height="11"/>
    <rect x="568" y="189" width="50" height="6"/>
    <rect x="620" y="191" width="50" height="4"/>
  </g>
  <g fill="currentColor" fill-opacity="0.65" font-size="11" text-anchor="middle">
    <text x="48" y="213">0</text>
    <text x="198" y="213">300 ms</text>
    <text x="348" y="213">600 ms</text>
    <text x="498" y="213">900 ms</text>
    <text x="648" y="213">1200 ms</text>
  </g>
  <line x1="115" y1="36" x2="115" y2="195" stroke="#6b6b76" stroke-dasharray="4 3" stroke-width="1.4"/>
  <text x="119" y="34" font-size="11" font-weight="600" fill="#6b6b76">p50 140 ms</text>
  <line x1="330" y1="36" x2="330" y2="195" stroke="#d9822b" stroke-dasharray="4 3" stroke-width="1.4"/>
  <text x="334" y="34" font-size="11" font-weight="600" fill="#d9822b">p95 540 ms</text>
  <line x1="470" y1="48" x2="470" y2="195" stroke="#8b5cf6" stroke-dasharray="4 3" stroke-width="1.4"/>
  <text x="474" y="46" font-size="11" font-weight="600" fill="#8b5cf6">p99 870 ms</text>
  <line x1="502" y1="36" x2="502" y2="195" stroke="#d94a44" stroke-dasharray="5 3"/>
  <text x="506" y="60" font-size="11" fill="#d94a44">SLO 800</text>
</svg>
