const tooltipEl = document.getElementById('node-tooltip');

function showTooltip(n, ev) {
  tooltipEl.innerHTML = '<strong>' + n.label + '</strong>' + (n.summary || '') + '<div class="tip-meta"><span class="badge">' + n.role + '</span> <code>' + n.path + '</code></div>';
  tooltipEl.classList.add('visible');
  tooltipEl.setAttribute('aria-hidden', 'false');
  positionTooltip(ev);
}

function positionTooltip(ev) {
  const pad = 12;
  let left = ev.clientX + pad;
  let top = ev.clientY + pad;
  const rect = tooltipEl.getBoundingClientRect();
  if (left + rect.width > window.innerWidth - 8) left = ev.clientX - rect.width - pad;
  if (top + rect.height > window.innerHeight - 8) top = ev.clientY - rect.height - pad;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
  tooltipEl.setAttribute('aria-hidden', 'true');
}

const edges = DATA.edges.filter(e => nodeById[e.from] && nodeById[e.to]);

function upstream(id) { return edges.filter(e => e.to === id && e.type !== 'unknown').map(e => e.from); }
function downstream(id) { return edges.filter(e => e.from === id && e.type !== 'unknown').map(e => e.to); }

Object.entries(ROLE_COLORS).forEach(([role, color]) => {
  const s = document.createElement('span');
  s.innerHTML = '<i style="background:' + color + '"></i> ' + role;
  legendEl.appendChild(s);
});

DATA.flows.forEach(flow => {
  const btn = document.createElement('button');
  btn.textContent = flow.label;
  btn.title = flow.trigger;
  btn.onclick = () => {
    activeFlow = activeFlow === flow.id ? null : flow.id;
    document.querySelectorAll('.flows button').forEach(b => b.classList.remove('active'));
    if (activeFlow) { btn.classList.add('active'); selectedId = null; }
    render();
  };
  flowsEl.appendChild(btn);
});

function renderDetail(id) {
  const n = nodeById[id];
  if (!n) return;
  const up = upstream(id);
  const down = downstream(id);
  const relatedFlows = DATA.flows.filter(f => f.steps.includes(id));
  detail.innerHTML = '<h2>' + n.label + '</h2>'
    + '<p><span class="badge">' + n.role + '</span><code>' + n.path + '</code></p>'
    + '<h3>Upstream</h3><ul>' + (up.length ? up.map(i => '<li>' + nodeById[i].label + '</li>').join('') : '<li class="empty">none evidenced</li>') + '</ul>'
    + '<h3>Downstream</h3><ul>' + (down.length ? down.map(i => '<li>' + nodeById[i].label + '</li>').join('') : '<li class="empty">none evidenced</li>') + '</ul>'
    + '<h3>Entrypoints</h3><ul>' + (n.entrypoints.length ? n.entrypoints.map(e => '<li><code>' + e.symbol + '</code> — ' + e.path + '</li>').join('') : '<li class="empty">none listed</li>') + '</ul>'
    + '<h3>Tests</h3><ul>' + (n.tests.length ? n.tests.map(t => '<li><code>' + t + '</code></li>').join('') : '<li class="empty">none listed</li>') + '</ul>'
    + '<h3>Constraints</h3><ul>' + n.constraints.map(c => '<li>' + c + '</li>').join('') + '</ul>'
    + '<h3>Evidence</h3><ul>' + n.evidence.map(e => '<li><code>' + e.symbol + '</code> @ ' + e.path + '</li>').join('') + '</ul>'
    + '<h3>Related flows</h3><ul>' + (relatedFlows.length ? relatedFlows.map(f => '<li>' + f.label + '</li>').join('') : '<li class="empty">none</li>') + '</ul>'
    + '<h3>End-to-end flows</h3><div class="flows" id="flows-inner"></div>';
  const inner = detail.querySelector('#flows-inner');
  DATA.flows.forEach(flow => {
    const btn = document.createElement('button');
    btn.textContent = flow.label;
    if (activeFlow === flow.id) btn.classList.add('active');
    btn.onclick = () => { activeFlow = activeFlow === flow.id ? null : flow.id; render(); renderDetail(id); };
    inner.appendChild(btn);
  });
}

function getFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const role = document.getElementById('role-filter').value;
  return { q, role };
}

function nodeVisible(n, f) {
  if (f.role && n.role !== f.role) return false;
  if (!f.q) return true;
  return n.label.toLowerCase().includes(f.q) || n.id.includes(f.q) || n.path.toLowerCase().includes(f.q);
}

function render() {
  const f = getFilter();
  const flowSteps = activeFlow ? new Set(DATA.flows.find(x => x.id === activeFlow).steps) : null;
  const upSet = selectedId ? new Set(upstream(selectedId)) : new Set();
  const downSet = selectedId ? new Set(downstream(selectedId)) : new Set();
  const hasFocus = selectedId || activeFlow;

  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', 'translate(' + transform.x + ',' + transform.y + ') scale(' + transform.scale + ')');
  svg.appendChild(g);

  const edgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  edgeG.setAttribute('class', 'edges');
  g.appendChild(edgeG);

  edges.forEach(e => {
    const a = POSITIONS[e.from], b = POSITIONS[e.to];
    if (!a || !b) return;
    const visA = nodeVisible(nodeById[e.from], f);
    const visB = nodeVisible(nodeById[e.to], f);
    if (!visA || !visB) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    const cls = ['edge'];
    if (e.type === 'unknown') cls.push('unknown');
    if (flowSteps && flowSteps.has(e.from) && flowSteps.has(e.to)) {
      const steps = DATA.flows.find(x => x.id === activeFlow).steps;
      const fi = steps.indexOf(e.from), ti = steps.indexOf(e.to);
      if (fi >= 0 && ti >= 0 && ti === fi + 1) cls.push('flow');
    }
    if (hasFocus && selectedId) {
      const rel = e.from === selectedId || e.to === selectedId || upSet.has(e.from) || downSet.has(e.to);
      if (!rel && e.type !== 'unknown') cls.push('dim');
    }
    if (hasFocus && activeFlow && !cls.includes('flow')) cls.push('dim');
    line.setAttribute('class', cls.join(' '));
    edgeG.appendChild(line);
  });

  DATA.nodes.forEach(n => {
    if (!nodeVisible(n, f)) return;
    const pos = POSITIONS[n.id];
    if (!pos) return;
    const ng = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    ng.setAttribute('class', 'node');
    ng.setAttribute('data-id', n.id);
    if (hasFocus) {
      if (selectedId === n.id) ng.classList.add('selected');
      else if (upSet.has(n.id)) ng.classList.add('highlight-up');
      else if (downSet.has(n.id)) ng.classList.add('highlight-down');
      else if (flowSteps && flowSteps.has(n.id)) ng.classList.add('selected');
      else ng.classList.add('dim');
    }
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y); circle.setAttribute('r', 28);
    circle.setAttribute('fill', ROLE_COLORS[n.role] || '#64748b');
    circle.setAttribute('stroke', '#1e2936');
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', pos.x); label.setAttribute('y', pos.y + 44);
    label.textContent = n.label.length > 22 ? n.label.slice(0, 20) + '…' : n.label;
    ng.appendChild(circle);
    ng.appendChild(label);
    ng.onmouseenter = (ev) => showTooltip(n, ev);
    ng.onmousemove = (ev) => { if (tooltipEl.classList.contains('visible')) positionTooltip(ev); };
    ng.onmouseleave = () => hideTooltip();
    ng.onclick = (ev) => { ev.stopPropagation(); selectedId = n.id; activeFlow = null; document.querySelectorAll('.flows button').forEach(b => b.classList.remove('active')); render(); renderDetail(n.id); };
    let dragNode = false, ndStart = null;
    circle.onmousedown = (ev) => { ev.stopPropagation(); dragNode = true; ndStart = { x: ev.clientX, y: ev.clientY, px: pos.x, py: pos.y }; };
    window.addEventListener('mousemove', (ev) => {
      if (!dragNode) return;
      pos.x = ndStart.px + (ev.clientX - ndStart.x) / transform.scale;
      pos.y = ndStart.py + (ev.clientY - ndStart.y) / transform.scale;
      render();
    });
    window.addEventListener('mouseup', () => { dragNode = false; });
    g.appendChild(ng);
  });
}

wrap.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const s = ev.deltaY > 0 ? 0.9 : 1.1;
  transform.scale = Math.min(2.5, Math.max(0.4, transform.scale * s));
  render();
}, { passive: false });

wrap.onmousedown = (ev) => {
  if (ev.target.closest('.node')) return;
  dragging = true; dragStart = { x: ev.clientX - transform.x, y: ev.clientY - transform.y };
  wrap.classList.add('dragging');
};
window.onmousemove = (ev) => {
  if (!dragging) return;
  transform.x = ev.clientX - dragStart.x;
  transform.y = ev.clientY - dragStart.y;
  render();
};
window.onmouseup = () => { dragging = false; wrap.classList.remove('dragging'); };

document.getElementById('search').oninput = render;
document.getElementById('role-filter').onchange = render;
document.getElementById('reset-view').onclick = () => { transform = { x: 40, y: 20, scale: 1 }; selectedId = null; activeFlow = null; render(); detail.innerHTML = '<h2>Select a module</h2><p class="empty">Click a node…</p><h3>End-to-end flows</h3><div class="flows" id="flows2"></div>'; const f2 = detail.querySelector('#flows2'); DATA.flows.forEach(flow => { const btn = document.createElement('button'); btn.textContent = flow.label; btn.onclick = () => { activeFlow = flow.id; render(); }; f2.appendChild(btn); }); };

function resize() { svg.setAttribute('viewBox', '0 0 ' + wrap.clientWidth + ' ' + wrap.clientHeight); render(); }
window.onresize = resize;
resize();
</script>
<div id="node-tooltip" class="node-tooltip" role="tooltip" aria-hidden="true"></div>
</body>
</html>
