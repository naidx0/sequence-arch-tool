<!doctype html>

  <style>
    :root { --bg:#0B0C0E; --bg2:#141518; --ink:#F5F5F7; --muted:#8B8D97; --mono:ui-monospace,monospace; }
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui;padding:48px 32px 80px}
    h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}
    .kicker{font:11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#C9C4A8;margin:0 0 12px}
    .lede{color:var(--muted);max-width:62ch;margin:0 0 36px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:40px}
    .card{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px;display:grid;gap:14px;justify-items:center}
    .card.light{background:#F4F4F5;color:#0B0C0E}
    .label{font:11px/1.4 var(--mono);color:var(--muted);text-align:center}
    .card.light .label{color:#666872}
    .sizes{display:flex;flex-wrap:wrap;gap:22px;align-items:end;justify-content:center}
  </style>
</head>
