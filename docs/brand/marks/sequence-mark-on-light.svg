<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence mark — SOURCE OF TRUTH (monochrome)
  ════════════════════════════════════════════════════════════════
  Black / white / currentColor only. Never gold on the glyph.
  Decision 26 (colour) · Decision 28 (geometry). Masters live here;
  site/desktop copies must match. Regenerated by
  packages/desktop/scripts/make-icon.mjs — edit the numbers there.

  Craft: three service nodes on one elbow route, read top-left to
  bottom-right. The product's own edge style, as a mark.
  Meaning: nodes = services · route = the sequence · one ink.

  Construction (64-unit grid):
    node centres     (14,14) (32,32) (50,50)
    node             18×18, rx 3.5
    route            elbow edges 6 wide, rounded ends, right then down
    bounds           5 → 59 both axes (centred, 180° symmetric)
    viewBox          = mark bounds; clear space ≥ 1/8 applied *outside*
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Sequence">
  <title>Sequence</title>
  <g fill="#0B0C0E">
    <rect x="11" y="11" width="24" height="6" rx="3"/>
    <rect x="29" y="11" width="6" height="24" rx="3"/>
    <rect x="29" y="29" width="24" height="6" rx="3"/>
    <rect x="47" y="29" width="6" height="24" rx="3"/>
    <rect x="5" y="5" width="18" height="18" rx="3.5"/>
    <rect x="23" y="23" width="18" height="18" rx="3.5"/>
    <rect x="41" y="41" width="18" height="18" rx="3.5"/>
  </g>
</svg>
