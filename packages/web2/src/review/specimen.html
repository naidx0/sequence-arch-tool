      local-first product that blocks first paint on a CDN contradicts itself.

      data-theme is pinned to dark rather than left to the system, because
      GRAPHITE-DECISIONS.md Decision 1 defers light and a measurement taken
      against untuned light tokens would be a measurement of work the owner has
      deferred.
