apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  flag: "on"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: server
        image: api
        env:
        - name: DB_ADDR
          value: "db:5432"
        - name: FEATURE_FLAG
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: flag
        - name: SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: token
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 80
